<text x="74" y="179" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#675f60">Jyotish, baked in technology, based in scriptures.</text>
<text x="74" y="226" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#675f60">Demystifying astrology through data science and technology.</text>
